apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  labels:
    app: productcatalogservice
spec:
  replicas: 1

  selector:
    matchLabels:
      app: productcatalogservice

  template:
    metadata:
      labels:
        app: productcatalogservice

    spec:
      containers:
        - name: productcatalogservice

          image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/productcatalogservice:v0.10.6

          ports:
            - name: grpc
              containerPort: 3550

          env:
            - name: PORT
              value: "3550"

            - name: DISABLE_PROFILER
              value: "1"

          readinessProbe:
            grpc:
              port: 3550

          livenessProbe:
            grpc:
              port: 3550

          resources:
            requests:
              cpu: 100m
              memory: 64Mi

            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  labels:
    app: productcatalogservice
spec:
  type: ClusterIP

  selector:
    app: productcatalogservice

  ports:
    - name: grpc
      port: 3550
      targetPort: 3550