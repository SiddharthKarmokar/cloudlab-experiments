apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
  labels:
    app: redis-cart
spec:
  replicas: 1

  selector:
    matchLabels:
      app: redis-cart

  template:
    metadata:
      labels:
        app: redis-cart

    spec:
      containers:
        - name: redis

          image: redis:alpine

          ports:
            - name: redis
              containerPort: 6379

          readinessProbe:
            tcpSocket:
              port: 6379

          livenessProbe:
            tcpSocket:
              port: 6379

          resources:
            requests:
              cpu: 70m
              memory: 200Mi

            limits:
              cpu: 125m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  labels:
    app: redis-cart
spec:
  type: ClusterIP

  selector:
    app: redis-cart

  ports:
    - name: redis
      port: 6379
      targetPort: 6379