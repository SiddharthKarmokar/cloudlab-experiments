apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
  labels:
    app: recommendationservice
spec:
  replicas: 1

  selector:
    matchLabels:
      app: recommendationservice

  template:
    metadata:
      labels:
        app: recommendationservice

    spec:
      containers:
        - name: recommendationservice

          image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/recommendationservice:v0.10.6

          ports:
            - name: grpc
              containerPort: 8080

          env:
            - name: PORT
              value: "8080"

            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"

            - name: DISABLE_PROFILER
              value: "1"

          readinessProbe:
            grpc:
              port: 8080

          livenessProbe:
            grpc:
              port: 8080

          resources:
            requests:
              cpu: 100m
              memory: 220Mi

            limits:
              cpu: 200m
              memory: 450Mi

---
apiVersion: v1
kind: Service
metadata:
  name: recommendationservice
  labels:
    app: recommendationservice
spec:
  type: ClusterIP

  selector:
    app: recommendationservice

  ports:
    - name: grpc
      port: 8080
      targetPort: 8080