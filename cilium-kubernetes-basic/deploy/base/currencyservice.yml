apiVersion: apps/v1
kind: Deployment
metadata:
  name: currencyservice
  labels:
    app: currencyservice
spec:
  replicas: 1

  selector:
    matchLabels:
      app: currencyservice

  template:
    metadata:
      labels:
        app: currencyservice

    spec:
      containers:
        - name: currencyservice

          image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/currencyservice:v0.10.6

          ports:
            - name: grpc
              containerPort: 7000

          env:
            - name: PORT
              value: "7000"

            - name: DISABLE_PROFILER
              value: "1"

          readinessProbe:
            grpc:
              port: 7000

          livenessProbe:
            grpc:
              port: 7000

          resources:
            requests:
              cpu: 100m
              memory: 64Mi

            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: currencyservice
  labels:
    app: currencyservice
spec:
  type: ClusterIP

  selector:
    app: currencyservice

  ports:
    - name: grpc
      port: 7000
      targetPort: 7000